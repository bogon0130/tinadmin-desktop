name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Windows"
            platform: "windows-latest"
            args: ""
          # [v0.4.1 임시] 원인 파악용으로 Windows만 빌드한다.
          # 문제 해결되면 아래 3개 주석을 다시 푼다.
          # - name: "macOS Apple Silicon"
          #   platform: "macos-latest"
          #   args: "--target aarch64-apple-darwin"
          # - name: "macOS Intel"
          #   platform: "macos-latest"
          #   args: "--target x86_64-apple-darwin"
          # - name: "Linux"
          #   platform: "ubuntu-22.04"
          #   args: ""
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: bun install

      # 실패 원인을 리포 admin 권한 없이도 확인하기 위해, 먼저 직접 빌드해서
      # 로그를 파일로 남기고 실패 시 마지막 부분을 annotation(::error::)으로 내보낸다.
      # annotation 은 공개 API로 읽을 수 있어서 로그 열람 권한이 없어도 원인 파악이 가능하다.
      - name: Pre-build (로그 캡처용)
        id: prebuild
        shell: bash
        continue-on-error: true
        env:
          # 서명이 켜져 있으면 이 단계도 서명을 하므로 동일한 키를 넘겨야 한다.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -o pipefail
          # 서명키가 실제로 넘어왔는지 값 노출 없이 확인 (원인 파악용)
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY 가 비어 있음 (Secret 미등록/이름 오타 의심)"
          else
            echo "서명키 길이: ${#TAURI_SIGNING_PRIVATE_KEY} 자"
          fi
          bun run tauri build ${{ matrix.args }} 2>&1 | tee build.log

      - name: 빌드 실패 시 에러 내용을 annotation 으로 출력
        if: steps.prebuild.outcome == 'failure'
        shell: bash
        run: |
          echo "----- build.log 마지막 120줄 -----"
          tail -n 120 build.log || true
          SNIP=$(tail -n 40 build.log | tr '\n' '~' | sed 's/%/%25/g; s/\r/ /g')
          echo "::error title=BUILD FAIL (tail 40, ~=개행)::${SNIP}"
          exit 1

      - name: Build and publish
        id: tauri
        uses: tauri-apps/tauri-action@action-v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 자동 업데이트 서명키 (GitHub Secrets에 등록되어 있어야 함)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: v__VERSION__
          releaseBody: See the assets to download this version.
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          retryAttempts: 2
          args: ${{ matrix.args }}
          assetNamePattern: "[name]-[version]-[platform]-[arch][ext]"
          # latest.json (업데이트 정보 파일) 을 Releases에 같이 올린다 → 앱이 이걸 보고 새 버전 확인
          includeUpdaterJson: true

      - name: Release summary
        if: steps.tauri.outputs.releaseHtmlUrl != ''
        shell: bash
        run: |
          {
            echo "## Tauri Release"
            echo ""
            echo "- Platform: \`${{ matrix.name }}\`"
            echo "- Version: \`${{ steps.tauri.outputs.appVersion }}\`"
            echo "- Release: ${{ steps.tauri.outputs.releaseHtmlUrl }}"
            echo "- Artifacts: \`${{ steps.tauri.outputs.artifactPaths }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
